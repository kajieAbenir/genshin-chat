<div class="selector-container">
  <!-- Tab buttons -->
  <div class="tab-bar">
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'receiver'"
      (click)="setTab('receiver')"
    >
      <span class="tab-icon">📥</span>
      Receiver
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab() === 'sender'"
      (click)="setTab('sender')"
    >
      <span class="tab-icon">📤</span>
      Sender
    </button>
    <div class="tab-indicator" [class.right]="activeTab() === 'sender'"></div>
  </div>

  <!-- Selected info -->
  <div class="selected-info">
    <span class="selected-label">Selected:</span>
    <span class="selected-name">
      {{ activeTab() === 'receiver' ? selectedReceiverName() : selectedSenderName() }}
    </span>
  </div>

  <!-- Search -->
  <div class="search-box">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input
      type="text"
      placeholder="Search character..."
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      spellcheck="false"
      autocomplete="off"
    />
  </div>

  <!-- Character list -->
  <div class="character-list">
    @for (region of groupedRegions(); track region) {
      <div class="region-group">
        <div class="region-header">{{ region }}</div>
        <div class="region-characters">
          @for (char of groupedCharacters()[region]; track char.name) {
            <button
              class="char-item"
              [class.selected]="isSelected(char)"
              (click)="selectCharacter(char)"
            >
              <span class="char-name">{{ char.name }}</span>
              @if (isSelected(char)) {
                <span class="check-mark">✓</span>
              }
            </button>
          }
        </div>
      </div>
    } @empty {
      <div class="empty-state">No characters found</div>
    }
  </div>
</div>
