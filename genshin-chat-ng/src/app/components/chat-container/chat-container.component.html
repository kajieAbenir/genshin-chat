<div class="chat-container">
  <!-- Header -->
  <div class="chat-header" (click)="openCharSelector()">
    <span class="header-name">{{ chatState.chatName() }}</span>
    <span class="header-hint">tap to select character</span>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #messagesContainer>
    @if (chatState.messages().length === 0) {
      <div class="empty-chat">
        <div class="empty-icon">💬</div>
        <div class="empty-title">No messages yet</div>
        <div class="empty-desc">Select characters and start chatting!</div>
      </div>
    }
    @for (msg of chatState.messages(); track msg.id) {
      <app-chat-message [message]="msg" />
    }
  </div>

  <!-- Toggle input menu button -->
  <button class="toggle-input-btn" (click)="toggleInputMenu()">
    {{ chatState.inputMenuVisible() ? '▼ Hide' : '▲ Show' }}
  </button>

  <!-- Input area -->
  @if (chatState.inputMenuVisible()) {
    <div class="chat-input-area">
      <!-- Upper: text input + send -->
      <div class="input-row">
        <input
          type="text"
          [(ngModel)]="inputText"
          (keydown)="onKeyDown($event)"
          placeholder="Type your message..."
          spellcheck="false"
          autocomplete="off"
          class="message-input"
        />
        <button
          class="send-btn"
          (click)="sendMessage()"
          [disabled]="!inputText.trim()"
          aria-label="Send Message"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>

      <!-- Lower: toggle + settings -->
      <div class="controls-row">
        <label class="toggle-switch">
          <input
            type="checkbox"
            [checked]="chatState.isSenderMode()"
            (change)="chatState.toggleMode()"
          />
          <span class="toggle-slider"></span>
        </label>
        <span class="toggle-label" [class.active]="chatState.isSenderMode()">
          {{ chatState.isSenderMode() ? 'Sender' : 'Receiver' }}
        </span>

        <div class="controls-spacer"></div>

        <button class="icon-btn" (click)="openSettings()" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>
  }
</div>

<!-- Floating windows -->
<app-floating-window
  [isVisible]="showCharSelector()"
  (closed)="closeCharSelector()"
>
  <app-character-selector />
</app-floating-window>

<app-floating-window
  [isVisible]="showSettings()"
  (closed)="closeSettings()"
>
  <app-settings />
</app-floating-window>
