<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.9" />
    <link rel="stylesheet" href="./src/css/index.css" />
    <title>Genshin Chat Simulator</title>
  </head>
  <body>
    <!-- loading screen -->
    <div id="loading" class="loading"></div>

    <!-- main content -->
    <div id="container" hidden>
      <div id="background-pic">
        <img src="" />
        <!-- insert bg pic here -->
      </div>

      <!-- floating charlist window - version 2 -->
      <div class="floating-window hidden" id="floatingReceiverSenderWindow">
        <div class="floating-content">
          <button class="close-button" id="closeReceiverSender">&times;</button>
          
          <div>
            <div class="tab-buttons">
                <div class="tab-button active" data-tab="tab1">Receiver</div>
                <div class="tab-button" data-tab="tab2">Sender</div>
            </div>

            <div class="tab-content-container">
                <div id="tab1" class="tab-content active">
                  <a> 
                    Selected: <a id="receiver-name">XIAOOOO</a>
                  </a>
                  <a 
                    class="chat-input charlist center" 
                    name="receiver-search">
                    <input/>
                  </a>
                  <div id="receiver-list">
                    <p>receiver</p>
                  </div>
                </div>
                <div id="tab2" class="tab-content">
                  <a> 
                    Selected: <a id="sender-name">XIAOOOO</a>
                  </a>
                  <a 
                    class="chat-input charlist center" 
                    name="sender-search">
                    <input/>
                  </a>
                  <div id="sender-list">
                    <p>receiver</p>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>

      <!-- floating settings window -->
      <div class="floating-window hidden" id="floatingSettingsWindow">
        <div class="floating-content">
          <button class="close-button" id="closeSettings">&times;</button>
          
          <div>
            <div class="tab-buttons">
                <div class="tab-button active" data-tab="tab3">⚙ Settings</div>
                <div class="tab-button" data-tab="tab4">📚 Credits</div>
            </div>

            <div class="tab-content-container">
              <!-- Settings tab -->
              <div id="tab3" class="tab-content active">
                <h2>Settings</h2>
              </div>

              <!-- Credits tab -->
              <div id="tab4" class="tab-content">
                <h2>Credits</h2>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-container" id="chat-container">
        <div class="chat-header" id="chat-name">Chat</div>

        <!-- chat messages -->
        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input" id="toggleInputMenu">
          <a>Hide</a>
        </div>

        <div class="chat-input" id="chatInputUpper">
          <!-- tba : list idk -->
          <button id="inputList">.---</button>
          <input
            type="text"
            id="chat-input"
            placeholder="Type your message..."
            spellcheck="false"
            autocomplete="off"
          />
          <button
            id="send"
            disabled
            aria-label="Send Message"
          >
            Send
          </button>
        </div>

        <div class="chat-input center" id="chatInputLower">
          <label class="switch">
            <input type="checkbox" id="switch" />
            <span class="slider round"></span>
          </label>
          <span style="color: white">Toggle Chat</span>

          <a id="settings"> ⚙ </a>
        </div>
      </div>
    </div>

    <!-- scripts -->
    <script src="./src/js/loading.js"></script>
    <script src="./src/js/app-chat.js"></script>

    <!-- api -->
    <script src="./src/js/api.js"></script>

    <noscript> Sorry! Your browser does not support JavaScript.</noscript>
  </body>
</html>
