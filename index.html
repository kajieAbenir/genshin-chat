<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.9" />
    <link rel="stylesheet" href="index.css" />
    <title>Genshin Chat Simulator</title>
  </head>
  <body>
    <!-- main content -->
    <div id="container">
      <div id="background-pic">
        <img src="" />
        <!-- insert bg pic here -->
      </div>

      <div class="chat-container" id="chat-container">
        <div class="chat-header">Chat</div>

        <div class="chat-messages" id="chat-messages">
          <div class="chat-message receiver">
            <div class="chat-bubble">Hello! How can I help you today?</div>
          </div>

          <div class="chat-message sender">
            <div class="chat-bubble">
              I have a question about aligning chat bubbles.
            </div>
          </div>

          <div class="chat-message receiver">
            <div class="chat-bubble">Sure, let's dive into it.</div>
          </div>
        </div>

        <div class="chat-input">
          <input
            type="text"
            id="chat-input"
            placeholder="Type your message..."
          />
          <button id="send" onclick="addConversation()">Send</button>
        </div>

        <div class="chat-input center">
          <label class="switch">
            <input type="checkbox" id="switch" />
            <span class="slider round"></span>
          </label>
          <span style="color: white;">Toggle Chat</span>
        </div>
      </div>
    </div>

    <script src="app-chat.js"></script>
    <script src="app-bg.js"></script>
  </body>
</html>
