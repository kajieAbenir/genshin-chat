<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./src/css/index.css"/>
    <title>Genshin Chat</title>
  </head>
  <body>
    <!-- loading screen -->
    <div id="loading" class="loading"></div>

    <!-- main content -->
    <div id="container">
      <div id="background-pic">
      </div>

      <!-- floating charlist window - version 2 -->
      <div class="floating-window hidden" id="floatingReceiverSenderWindow" role="dialog" aria-modal="true" aria-labelledby="tab1-title">
        <div class="floating-content">
          <button type="button" class="close-button" id="closeReceiverSender" aria-label="Close window">&times;</button>
          
          <div>
            <div class="tab-buttons" role="tablist">
                <button class="tab-button active" data-tab="tab1" role="tab" aria-selected="true">Receiver</button>
                <button class="tab-button" data-tab="tab2" role="tab" aria-selected="false">Sender</button>
            </div>

            <div class="tab-content-container">
                <div id="tab1" class="tab-content active" role="tabpanel">
                  <div id="tab1-title"> 
                    Selected: <span id="receiver-name">None</span>
                  </div>
                  <div 
                    class="chat-input charlist center" 
                    name="receiver-search">
                    <label for="recv-search-input" class="hidden">Search Receiver</label>
                    <input id="recv-search-input" placeholder="Search character..."/>
                  </div>
                  <br>
                  <div id="receiver-list">
                    <p>receiver</p>
                  </div>
                </div>
                <div id="tab2" class="tab-content" role="tabpanel">
                  <div> 
                    Selected: <span id="sender-name">None</span>
                  </div>
                  <div 
                    class="chat-input charlist center" 
                    name="sender-search">
                    <label for="send-search-input" class="hidden">Search Sender</label>
                    <input id="send-search-input" placeholder="Search character..."/>
                  </div>
                  <br>
                  <div id="sender-list">
                    <p>sender</p>
                  </div>
                </div>
            </div>
          </div>
        </div>
      </div>

      <!-- floating settings window -->
      <div class="floating-window hidden" id="floatingSettingsWindow" role="dialog" aria-modal="true">
        <div class="floating-content">
          <button class="close-button" id="closeSettings" aria-label="Close settings">&times;</button>
          
          <div>
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="tab3">⚙ Settings</button>
                <button class="tab-button" data-tab="tab4">📚 Credits</button>
            </div>

            <div class="tab-content-container">
              <!-- Settings tab -->
              <div id="tab3" class="tab-content active">
                <h2>Settings</h2>
              </div>

              <!-- Credits tab -->
              <div id="tab4" class="tab-content">
                <h2>Credits</h2>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="chat-container" id="chat-container">
        <div class="chat-header" id="chat-name">Chat</div>

        <!-- chat messages -->
        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input" id="toggleInputMenu">
          <button type="button" id="toggleInputBtn">
            Hide
          </button>
        </div>

        <div class="chat-input" id="chatInputUpper">
          <!-- tba : list idk -->
          <button id="inputList">.---</button>
          <label for="chat-input" class="hidden">Message Input</label>
          <input
            type="text"
            id="chat-input"
            placeholder="Type your message..."
            spellcheck="false"
            autocomplete="off"
          />
          <button
            type="button"
            id="send"
            aria-label="Send Message"
            disabled
          >
            Send
          </button>
        </div>

        <div class="chat-input center" id="chatInputLower">
          <label class="switch" aria-label="Toggle sender/receiver">
            <input type="checkbox" id="switch" />
            <span class="slider round"></span>
          </label>
          <span id="toggleChat">Toggle Chat</span>

          <button id="settings" aria-label="Open settings" type="button"> 
            ⚙ 
          </button>
        </div>
      </div>
    </div>

    <!-- scripts -->
    <script type="module" src="./src/js/main-script.js"></script>

    <noscript> Sorry! Your browser does not support JavaScript.</noscript>
  </body>
</html>
