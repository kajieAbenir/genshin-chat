<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.9" />
    <link rel="stylesheet" href="./src/css/index.css" />
    <title>Genshin Chat Simulator</title>
  </head>
  <body>
    <!-- loading screen -->
    <div id="loading" class="loading"></div>

    <!-- main content -->
    <div id="container">
      <div id="background-pic">
        <img src="" />
        <!-- insert bg pic here -->
      </div>

      <!-- Floating window - for char list -->
      <!-- FOR REWORKING. -->
      <div class="floating-window" id="floatingWindow" style="display: none">
        <div class="floating-content">
          <button class="close-button" id="closeButton">&times;</button>
          <h2>Select Receiver</h2>
          <!-- search bar -->
          <a class="chat-input charlist center" name="receiver-search"
            ><input
          /></a>
          <div id="receiver-list" style="height: 150px; overflow-y: scroll">
            <p>receiver</p>
          </div>
          <h2>Select Sender</h2>
          <!-- search bar -->
          <a class="chat-input charlist center" name="sender-search"
            ><input
          /></a>
          <div id="sender-list" style="height: 150px; overflow-y: scroll">
            <p>sender</p>
          </div>

          <!-- Additional content can go here -->
        </div>
      </div>

      <div class="chat-container" id="chat-container">
        <div class="chat-header" id="chat-name">Chat</div>
        <div></div>

        <!-- chat messages -->
        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input" id="toggleInputMenu">
          <a>Hide</a>
        </div>

        <div class="chat-input" id="chatInputUpper">
          <!-- tba : list idk -->
          <button id="inputList">.---</button>
          <input
            type="text"
            id="chat-input"
            placeholder="Type your message..."
            spellcheck="false"
            autocomplete="off"
          />
          <button
            id="send"
            onclick="addConversation()"
            disabled
            aria-label="Send Message"
          >
            Send
          </button>
        </div>

        <div class="chat-input center" id="chatInputLower">
          <label class="switch">
            <input type="checkbox" id="switch" />
            <span class="slider round"></span>
          </label>
          <span style="color: white">Toggle Chat</span>

          <a id="settings"> ⚙ </a>
        </div>
      </div>
    </div>

    <!-- scripts -->
    <script src="./src/js/loading.js"></script>
    <script src="./src/js/app-chat.js"></script>
    <script src="./src/js/app-chat.js"></script>
    
  </body>
</html>
